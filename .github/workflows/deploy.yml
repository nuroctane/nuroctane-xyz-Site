# Deploy notify for nuroctane.xyz (+ optional wrangler when token is set).
#
# Preferred production path: Cloudflare Workers Builds.
# Leave CLOUDFLARE_API_TOKEN unset while Builds is healthy (avoids double-deploy).
# This workflow always stays green and comments on one persistent, assigned
# "deployment" issue so GitHub reliably notifies on every main push.

name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nuroctane-xyz
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_NAME: nuroctane.xyz
      SITE_URL: https://www.nuroctane.xyz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Cloudflare token
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN unset - production deploys via Workers Builds."
          fi

      - name: Setup pnpm
        if: steps.cf.outputs.has_token == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node
        if: steps.cf.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.cf.outputs.has_token == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.cf.outputs.has_token == 'true'
        run: pnpm run build
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

      - name: Deploy
        if: steps.cf.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: pnpm

      - name: Notify GitHub
        if: always() && (success() || steps.cf.outputs.has_token == 'false')
        uses: actions/github-script@v7
        env:
          HAS_TOKEN: ${{ steps.cf.outputs.has_token }}
        with:
          script: |
            const site = process.env.SITE_NAME;
            const url = process.env.SITE_URL;
            const via = process.env.HAS_TOKEN === 'true' ? 'github-actions' : 'workers-builds';
            const sha = context.sha.slice(0, 7);
            const msg = (context.payload.head_commit?.message || context.sha)
              .split('\n')[0]
              .slice(0, 72);
            const deploymentTitle = `Deployed ${site} @ ${sha} - ${msg}`;
            const body = [
              `**${site}** production deploy`,
              ``,
              `- Site: ${url}`,
              `- Commit: \`${context.sha}\``,
              `- Actor: @${context.actor}`,
              `- Path: \`${via}\``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'deployment',
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'deployment',
                color: '0E8A16',
                description: 'Production deploy notifications',
              });
            }

            const notificationsTitle = `Deployment notifications - ${site}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'deployment',
              per_page: 100,
            });
            let issue = issues.find(item =>
              !item.pull_request && item.title === notificationsTitle
            );

            if (issue) {
              issue = (await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'open',
                assignees: [context.repo.owner],
              })).data;
            } else {
              issue = (await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: notificationsTitle,
                body: `Persistent production deployment notifications for **${site}**. Keep this issue open and subscribed.`,
                labels: ['deployment'],
                assignees: [context.repo.owner],
              })).data;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `@${context.repo.owner}\n\n${body}`,
            });

            try {
              const deployment = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: 'production',
                auto_merge: false,
                required_contexts: [],
                description: deploymentTitle,
                production_environment: true,
              });
              const id = deployment.data && deployment.data.id;
              if (id) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: id,
                  state: 'success',
                  environment_url: url,
                  log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  description: `Live via ${via}`,
                });
              }
            } catch (e) {
              core.warning(`deployment record skipped: ${e.message}`);
            }
