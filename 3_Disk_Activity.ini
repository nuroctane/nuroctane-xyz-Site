; Lines starting ; (semicolons) are commented out.
; That is, they do not affect the code and are here for demonstration purposes only.
; ----------------------------------

; Disk Read/Write Activity Skin (#3)
; Shows real-time I/O activity for 4 drives with self-scaling activity bars.
; Uses UsageMonitor plugin + Calc measures for peak-tracking bars.

[Rainmeter]
Update=1000
Background=#@#Background.png
BackgroundMode=3
BackgroundMargins=0,34,0,14

[Metadata]
Name=Disk Activity
Author=NurCLI
Information=Displays disk read/write activity with self-scaling bars.
License=Creative Commons BY-NC-SA 3.0
Version=1.0.0

[Variables]
fontName=Trebuchet MS
textSize=8
colorBar=235,170,0,255
colorText=255,255,255,205
colorRead=100,200,100,255
colorWrite=200,100,100,255
disk1=C:
disk2=D:
disk3=G:
disk4=E:

; ----------------------------------
; MEASURES - UsageMonitor for disk I/O
; ----------------------------------

; Drive C:
[measureDisk1Read]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=Disk Read Bytes/sec
Name=#disk1#
UpdateDivider=1

[measureDisk1Write]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=Disk Write Bytes/sec
Name=#disk1#
UpdateDivider=1

; Drive D:
[measureDisk2Read]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=Disk Read Bytes/sec
Name=#disk2#
UpdateDivider=1

[measureDisk2Write]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=Disk Write Bytes/sec
Name=#disk2#
UpdateDivider=1

; Drive G:
[measureDisk3Read]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=Disk Read Bytes/sec
Name=#disk3#
UpdateDivider=1

[measureDisk3Write]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=Disk Write Bytes/sec
Name=#disk3#
UpdateDivider=1

; Drive E:
[measureDisk4Read]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=Disk Read Bytes/sec
Name=#disk4#
UpdateDivider=1

[measureDisk4Write]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=Disk Write Bytes/sec
Name=#disk4#
UpdateDivider=1

; ----------------------------------
; CALC MEASURES - Peak tracking for self-scaling bars
; These track the maximum observed value to give bars a dynamic ceiling
; ----------------------------------

[measureDisk1ReadPeak]
Measure=Calc
Formula=max(measureDisk1Read, measureDisk1ReadPeak)
UpdateDivider=1

[measureDisk1WritePeak]
Measure=Calc
Formula=max(measureDisk1Write, measureDisk1WritePeak)
UpdateDivider=1

[measureDisk2ReadPeak]
Measure=Calc
Formula=max(measureDisk2Read, measureDisk2ReadPeak)
UpdateDivider=1

[measureDisk2WritePeak]
Measure=Calc
Formula=max(measureDisk2Write, measureDisk2WritePeak)
UpdateDivider=1

[measureDisk3ReadPeak]
Measure=Calc
Formula=max(measureDisk3Read, measureDisk3ReadPeak)
UpdateDivider=1

[measureDisk3WritePeak]
Measure=Calc
Formula=max(measureDisk3Write, measureDisk3WritePeak)
UpdateDivider=1

[measureDisk4ReadPeak]
Measure=Calc
Formula=max(measureDisk4Read, measureDisk4ReadPeak)
UpdateDivider=1

[measureDisk4WritePeak]
Measure=Calc
Formula=max(measureDisk4Write, measureDisk4WritePeak)
UpdateDivider=1

; ----------------------------------
; STYLES
; ----------------------------------

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=Left
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleRightText]
StringAlign=Right
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleReadBar]
BarColor=#colorRead#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,15

[styleWriteBar]
BarColor=#colorWrite#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,15

; ----------------------------------
; METERS
; ----------------------------------

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=100
Y=12
W=190
H=18
Text=Disk Activity

; ===== DRIVE 1 (C:) =====
[meterLabelDisk1]
Meter=String
MeterStyle=styleLeftText
X=10
Y=40
W=190
H=14
Text=#disk1#\

[meterValueDisk1Read]
Meter=String
MeterStyle=styleRightText
MeasureName=measureDisk1Read
X=200
Y=0r
W=190
H=14
Text=R: %1B/s
NumOfDecimals=1
AutoScale=1

[meterBarDisk1Read]
Meter=Bar
MeterStyle=styleReadBar
MeasureName=measureDisk1Read
X=10
Y=52
W=190
H=1
DynamicVariables=1
Formula=measureDisk1Read / (measureDisk1ReadPeak + 1)

[meterValueDisk1Write]
Meter=String
MeterStyle=styleRightText
MeasureName=measureDisk1Write
X=200
Y=0r
W=190
H=14
Text=W: %1B/s
NumOfDecimals=1
AutoScale=1

[meterBarDisk1Write]
